[project]
name = "papertrail-backend"
version = "0.1.0"
description = "PaperTrail: retrieval-augmented Q&A over your PDFs, with citations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "chromadb>=0.5",
    "openai>=1.40",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
